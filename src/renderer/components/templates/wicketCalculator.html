<template id="wicket-calculator-template">
	<div class="calculator-card" data-calculator="wicket">
		<div class="calculator-card__switches">
			<label class="calculator-card__radio">
				<input
					id="wicked-in-post"
					type="radio"
					name="wicket-installation"
					value="posts"
					checked
				/>
				<span>На столбах</span>
			</label>
			<label class="calculator-card__radio">
				<input
					id="wicked-in-frame"
					type="radio"
					name="wicket-installation"
					value="frame"
				/>
				<span>В раме</span>
			</label>
		</div>

		<div class="calculator-fields">
			<label class="calculator-field calculator-field--short">
				<span>Ширина (мм)</span>
				<select id="wicket-width" class="text-input">
					<option value="" disabled selected>Выберите ширину</option>
					<option value="1000">1000</option>
					<option value="1250">1250</option>
					<option value="1500">1500</option>
					<option value="1750">1750</option>
					<option value="2000">2000</option>
				</select>
			</label>
			<label class="calculator-field calculator-field--short">
				<span>Высота (мм)</span>
				<select id="wicket-height" class="text-input">
					<option value="" disabled selected>Выберите высоту</option>
					<option value="1030">1030</option>
					<option value="1230">1230</option>
					<option value="1530">1530</option>
					<option value="1730">1730</option>
					<option value="1930">1930</option>
					<option value="2030">2030</option>
					<option value="2230">2230</option>
					<option value="2430">2430</option>
				</select>
			</label>
			<label class="calculator-field">
				<span>Материал каркаса</span>
				<input
					type="search"
					id="wicket-frame-material"
					class="text-input calculator-item-from-price"
					name="wicket-frame-material"
					placeholder="Поиск товара..."
					required
				/>
			</label>
			<label class="calculator-field">
				<span>Столбы (Рама)</span>
				<input
					type="search"
					id="wicket-posts"
					class="text-input calculator-item-from-price"
					name="wicket-posts"
					placeholder="Поиск товара..."
					required
				/>
			</label>
			<label class="calculator-field">
				<span>Обшивка</span>
				<input
					type="search"
					id="wicket-cladding"
					class="text-input calculator-item-from-price"
					name="wicket-cladding"
					placeholder="Поиск товара..."
					required
				/>
			</label>
			<label class="calculator-field calculator-field--inactive">
				<span>Шаг штакетника (мм)</span>
				<select id="wicket-cladding-step" class="text-input" disabled>
					<option value="10">10</option>
					<option value="20">20</option>
					<option value="30" selected>30</option>
					<option value="40">40</option>
					<option value="50">50</option>
					<option value="60">60</option>
					<option value="70">70</option>
					<option value="80">80</option>
					<option value="90">90</option>
					<option value="100">100</option>
				</select>
			</label>
			<label class="calculator-field">
				<span>Покраска</span>
				<input
					type="search"
					id="wicket-paint"
					class="text-input calculator-item-from-price"
					name="wicket-paint"
					placeholder="Поиск товара..."
					required
				/>
			</label>
		</div>

		<button class="calculator-card__button" type="button" disabled>
			Рассчитать
		</button>
	</div>
</template>
