<template id="wicket-calculator-template">
	<div class="calculator-card" data-calculator="wicket">
		<div class="calculator-card__switches">
			<label class="calculator-card__radio">
				<input id="wicked-in-post" type="radio" name="wicket-installation" value="posts" checked />
				<span>На столбах</span>
			</label>
			<label class="calculator-card__radio">
				<input id="wicked-in-frame" type="radio" name="wicket-installation" value="frame" />
				<span>В раме</span>
			</label>
			<label class="calculator-card__checkbox">
				<input id="wicket-both-sides-sheathing" type="checkbox" name="wicket-both-sides-sheathing" />
				<span>Обшивка с 2-х сторон</span>
			</label>
		</div>

		<div class="calculator-fields">
			<label class="calculator-field">
				<span>Тип калитки</span>
				<div class="field-row radio-cards-box">

						</div>
					</label>-->
					<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type2" checked />
						<div class="radio-card-box" type="button">
							<img src="./assets/wicket/wicket-type2.svg" alt="калитка тип 2" />
						</div>
					</label>
					<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type3" />
						<div class="radio-card-box" type="button">
							<img src="./assets/wicket/wicket-type3.svg" alt="калитка тип 3" />
						</div>
					</label>
					<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type4" />
						<div class="radio-card-box" type="button">
							<img src="./assets/wicket/wicket-type4.svg" alt="калитка тип 4" />
						</div>
					</label>
					<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type5" />
						<div class="radio-card-box" type="button">
							<img src="./assets/wicket/wicket-type5.svg" alt="калитка тип 5" />
						</div>
					</label>
					<!--<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type6" />
						<div class="radio-card-box" type="button">
							<img src="./assets/wicket/wicket-type6.svg" alt="калитка тип 6" />
						</div>
					</label>
					<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type7" />
						<div class="radio-card-box" type="button">
							<img src="./assets/wicket/wicket-type7.svg" alt="калитка тип 7" />
						</div>
					</label>
					<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type8" />
						<div class="radio-card-box" type="button">
							<img src="./assets/wicket/wicket-type8.svg" alt="калитка тип 8" />
						</div>
					</label>
					<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type9" />

							<img src="./assets/wicket/wicket-type9.svg" alt="калитка тип 9" />
						</div>
					</label>
					<label class="radio-card">
						<input class="hidden" type="radio" name="wicket-type" value="wicket-type10" />

							<img src="./assets/wicket/wicket-type10.svg" alt="калитка тип 10" />
						</div>
					</label>-->
				</div>
			</label>
			<label class="calculator-field calculator-field--short">
				<span>Ширина проёма (мм)</span>
				<input id="wicket-width" class="text-input" type="number" min="800" max="2000" step="1" placeholder="1000" value="1000" />
				<small>Параметры от 800 до 2000</small>
				<!--<select id="wicket-width" class="text-input">
					<option value="" disabled selected>Выберите ширину</option>
				</select>-->
			</label>
			<label class="calculator-field calculator-field--short">
				<span>Высота проёма (мм)</span>
				<input id="wicket-height" class="text-input" type="number" min="800" max="4000" step="1" placeholder="1000" value="1000" />
				<small>Параметры от 800 до 4000</small>
				<!--<select id="wicket-height" class="text-input">
					<option value="" disabled selected>Выберите высоту</option>
				</select>-->
			</label>
			<label class="calculator-field calculator-field--short">
				<span>Наценка на обрезь (%)</span>
				<input id="wicket-markup-on-trimmings" class="text-input" type="number" min="1" max="1000" step="1" placeholder="0" />
			</label>
			<label class="calculator-field--with-markup">
				<span>Материал каркаса</span>
				<input type="search" id="wicket-frame-material" class="text-input calculator-item-from-price" name="wicket-frame-material" placeholder="Поиск товара..." required />
				<input class="calculator-markup text-input" type="number" min="1" max="1000" step="1" placeholder="0" />
				<span>Наценка <small>(от 1 до 1000 %)</small></span>
			</label>
			<label class="calculator-field--with-markup">
				<span>Материал перегородок</span>
				<input type="search" id="wicket-partitions-material" class="text-input calculator-item-from-price" name="wicket-partitions-material" placeholder="Поиск товара..." required />
				<input class="calculator-markup text-input" type="number" min="1" max="1000" step="1" placeholder="0" />
				<span>Наценка <small>(от 1 до 1000 %)</small></span>
			</label>
			<label class="calculator-field--with-markup">
				<span>Столбы (Рама)</span>
				<input type="search" id="wicket-posts" class="text-input calculator-item-from-price" name="wicket-posts" placeholder="Поиск товара..." required />
				<input class="calculator-markup text-input" type="number" min="1" max="1000" step="1" placeholder="0" />
				<span>Наценка <small>(от 1 до 1000 %)</small></span>
			</label>
			<label class="calculator-field--with-markup">
				<span>Обшивка</span>
				<input type="search" id="wicket-cladding" class="text-input calculator-item-from-price" name="wicket-cladding" placeholder="Поиск товара..." required />
				<input class="calculator-markup text-input" type="number" min="1" max="1000" step="1" placeholder="0" />
				<span>Наценка <small>(от 1 до 1000 %)</small></span>
			</label>
			<label class="calculator-field calculator-field--inactive">
				<span>Шаг штакетника (мм)</span>
				<select id="wicket-cladding-step" class="text-input" disabled></select>
			</label>
			<label class="calculator-field--with-markup">
				<span>Покраска</span>
				<input type="search" id="wicket-paint" class="text-input calculator-item-from-price" name="wicket-paint" placeholder="Поиск товара..." required />
				<input class="calculator-markup text-input" type="number" min="1" max="1000" step="1" placeholder="0" value="0" />
				<span>Наценка <small>(от 1 до 1000 %)</small></span>
			</label>
		</div>

		<button class="calculator-card__button" type="button" disabled>Рассчитать</button>
	</div>
</template>
